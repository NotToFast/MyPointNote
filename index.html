async function xup(path,blob,mime,cb){const ss=(await sb.auth.getSession()).data.session;if(!ss)throw Error('Sesi berakhir, masuk kembali');return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST',`${SB_URL}/storage/v1/object/${BK}/${path}`);x.setRequestHeader('Authorization','Bearer '+ss.access_token);x.setRequestHeader('apikey',SB_KEY);x.setRequestHeader('x-upsert','true');x.setRequestHeader('Content-Type',mime);x.upload.onprogress=ev=>ev.lengthComputable&&cb(ev.loaded/ev.total);x.onload=()=>x.status<300?ok():no(Error(`Server menolak unggahan (${x.status})`));x.onerror=()=>no(Error('Koneksi terputus'));x.send(blob)})}
async function syncFiles(){if(!sb||!user)return;try{const T=sb.from('pn_files'),{data:rows,error}=await T.select('id,path');if(error){CS.st=/42P01|PGRST205|does not exist|schema cache|not find/i.test((error.code||'')+' '+error.message)?'nosetup':'err';return}
const{data:full}=await T.select('id,name,mime,size,sha,path');(full||[]).forEach(r=>{const m=S.files[r.id];if(m){m.cloud=1;m.path=r.path}else if(refs(r.id)&&OKT[r.mime])S.files[r.id]={id:r.id,name:r.name,mime:r.mime,size:r.size,h:r.sha||'',t:Date.now(),cloud:1,path:r.path}});
for(const q of(S.fdel||[]).slice()){if(!refs(q.id)){const a=await sb.storage.from(BK).remove([q.path]),b=await T.delete().eq('id',q.id);if(a.error||b.error)continue}S.fdel=S.fdel.filter(x=>x!==q)}
for(const fid of Object.keys(S.files)){const m=S.files[fid];if(m.cloud||!refs(fid))continue;const b=await bGet('blobs',fid).catch(()=>null);if(!b)continue;const k='c'+fid;tray(k,{name:m.name,p:0,msg:'Mengunggah ke cloud…'});
try{const path=user.id+'/'+fid;await xup(path,b,m.mime,r=>tray(k,{p:Math.round(r*100)}));const{error:e2}=await T.upsert({id:fid,user_id:user.id,name:m.name,mime:m.mime,size:m.size,sha:m.h||null,path},{onConflict:'user_id,id'});if(e2)throw e2;m.cloud=1;m.path=path;tray(k,null)}catch(e){tray(k,{err:1,msg:'Unggahan cloud gagal: '+(e.message||'coba lagi nanti')+'. File tetap aman di perangkat ini.'});CS.st='err';return}}
CS.st='ok'}catch(e){CS.st='err'}}
